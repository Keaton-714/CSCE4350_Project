<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='CSS/main.css') }}">
</head>
<body data-user="{{ user }}">
  <div class="topbar">
    <h1>Welcome, {{ user }}</h1>
    <form action="{{ url_for('auth.logout') }}" method="POST">
      <button type="submit">Sign out</button>
    </form>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-browse" aria-controls="panel-browse" aria-selected="true">Browse</button>
    <button role="tab" id="tab-cart" aria-controls="panel-cart" aria-selected="false">Cart <span class="badge" id="cart-badge" hidden>0</span></button>
    <button role="tab" id="tab-history" aria-controls="panel-history" aria-selected="false">Purchase History</button>
  </div>

  <!-- BROWSE -->
  <section class="panel" id="panel-browse" role="tabpanel" aria-labelledby="tab-browse">
    <h2>Browse Parts</h2>
    <div class="filters">
      <label for="store-select">Select Store:</label>
      <select id="store-select">
          <option value="">Choose a store</option>
      </select>
    </div>
    <div class="filters">
      <input id="search" type="search" placeholder="Search parts..." aria-label="Search parts">
      <select id="category" aria-label="Category"><option value="">All categories</option></select>
    </div>
    <div class="grid" id="parts-grid"></div>
    <p id="parts-empty" hidden>No parts match your search.</p>
  </section>

  <!-- CART -->
  <section class="panel" id="panel-cart" role="tabpanel" aria-labelledby="tab-cart" hidden>
    <h2>Shopping Cart</h2>
    <p id="cart-empty">Your cart is empty. Add parts from the Browse tab.</p>
    <table id="cart-table" hidden>
      <thead><tr><th>Part</th><th class="num">Price</th><th>Quantity</th><th class="num">Subtotal</th><th></th></tr></thead>
      <tbody id="cart-body"></tbody>
      <tfoot><tr class="total-row"><td colspan="3">Total</td><td class="num" id="cart-total"></td><td></td></tr></tfoot>
    </table>
    <div class="cart-actions" id="cart-actions" hidden>
      <button class="secondary" id="clear-cart">Clear cart</button>
      <button class="primary" id="checkout">Place order</button>
    </div>
  </section>

  <!-- HISTORY -->
  <section class="panel" id="panel-history" role="tabpanel" aria-labelledby="tab-history" hidden>
    <h2>Purchase History</h2>
    <div id="orders"></div>
  </section>

  <!-- PART DETAILS -->
  <dialog id="part-dialog">
    <h2 id="d-name"></h2>
    <p id="d-desc"></p>
    <dl>
      <dt>Part #</dt><dd id="d-id"></dd>
      <dt>Category</dt><dd id="d-cat"></dd>
      <dt>Price</dt><dd id="d-price"></dd>
      <dt>Availability</dt><dd id="d-stock"></dd>
    </dl>
    <p>
      <label>Quantity
        <input id="d-qty" type="number" min="1" value="1" style="width:4em">
      </label>
    </p>
    <div class="cart-actions">
      <button class="secondary" id="d-close">Close</button>
      <button class="primary" id="d-add">Add to cart</button>
    </div>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <script src="{{ url_for('static', filename='JS/main.js') }}" defer></script>
</body>
</html>
