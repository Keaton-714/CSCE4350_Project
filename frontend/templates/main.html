<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <style>
    .tabs { border-bottom: 1px solid #999; margin: 1em 0; }
    .tabs button {
      border: 1px solid #999; border-bottom: none; background: #eee;
      padding: .5em 1em; margin-right: 4px; cursor: pointer;
    }
    .tabs button[aria-selected="true"] { background: #fff; font-weight: bold; }
    .panel[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Welcome</h1>
  <p><a href="{{ url_for('logout') }}">Sign out</a></p>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-browse" aria-controls="panel-browse" aria-selected="true">Browse</button>
    <button role="tab" id="tab-history" aria-controls="panel-history" aria-selected="false">Purchase History</button>
    <button role="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="false">Settings</button>
  </div>

  <section class="panel" id="panel-browse" role="tabpanel" aria-labelledby="tab-browse">
    <h2>Browse</h2>
    <p>Nothing here yet.</p>
  </section>

  <section class="panel" id="panel-history" role="tabpanel" aria-labelledby="tab-history" hidden>
    <h2>Purchase History</h2>
    <p>Nothing here yet.</p>
  </section>

  <section class="panel" id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
    <h2>Settings</h2>
    <p>Nothing here yet.</p>
  </section>

  <script>
    const tabs = document.querySelectorAll('[role="tab"]');

    function showTab(tab) {
      tabs.forEach(t => {
        const selected = t === tab;
        t.setAttribute('aria-selected', selected);
        document.getElementById(t.getAttribute('aria-controls')).hidden = !selected;
      });
    }

    tabs.forEach(t => t.addEventListener('click', () => showTab(t)));
  </script>
</body>
</html>
