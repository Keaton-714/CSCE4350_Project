<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up</title>
</head>
<body>
  <h1>Sign up</h1>

  {% if errors %}
    <ul style="color:red">
      {% for e in errors %}
        <li>{{ e }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <form action="{{ url_for('auth.signup') }}" method="post">
    <h2>Account</h2>

    <p><label>Email
      <input name="email" type="email"
             value="{{ form.email }}" required autofocus>
    </label></p>

    <p><label>Password
      <input name="password" type="password" minlength="8" required>
    </label></p>

    <p><label>Confirm password
      <input name="confirm_password" type="password" minlength="8" required>
    </label></p>

    <h2>Personal information</h2>

    <p><label>First name
      <input name="first_name" value="{{ form.first_name }}" required>
    </label></p>

    <p><label>Last name
      <input name="last_name" value="{{ form.last_name }}" required>
    </label></p>

    <p><label>Phone
      <input name="phone" type="tel" value="{{ form.phone }}" required>
    </label></p>

    <button type="submit">Create account</button>
  </form>

  <p>Already have an account?
    <a href="{{ url_for('auth.login') }}">Sign in</a>
  </p>
</body>
</html>
